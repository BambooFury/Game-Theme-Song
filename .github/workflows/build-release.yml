name: Build & Attach Release Asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --no-scripts

      - name: Build plugin
        run: bun run build:assets && bunx --bun starlight pack --release -o .

      - name: Rename package
        run: cp com.bamboofury.game-theme-song.star game-theme-song.star

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: game-theme-song.star
          token: ${{ secrets.GITHUB_TOKEN }}
