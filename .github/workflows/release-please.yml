name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-asset:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build plugin
        run: pnpm run build

      - name: Stage release files
        run: |
          mkdir -p _release/game-theme-song
          cp plugin.json _release/game-theme-song/
          cp README.md _release/game-theme-song/
          cp LICENSE _release/game-theme-song/
          cp -r backend _release/game-theme-song/
          cp -r .millennium _release/game-theme-song/
          if [ -d icons ]; then cp -r icons _release/game-theme-song/; fi

      - name: Create zip archive
        run: |
          cd _release
          zip -r "../game-theme-song-${{ needs.release-please.outputs.tag_name }}.zip" game-theme-song

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: game-theme-song-*.zip
          token: ${{ secrets.GITHUB_TOKEN }}